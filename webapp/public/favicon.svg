<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- vertical ray -->
  <rect x="15" y="2" width="2" height="28" rx="1" fill="#0F4C81" opacity="0.65"/>
  <!-- horizontal ray -->
  <rect x="2" y="15" width="28" height="2" rx="1" fill="#0F4C81" opacity="0.65"/>
  <!-- diagonal ray NW-SE -->
  <rect x="15" y="2" width="2" height="25" rx="1" fill="#0F4C81" opacity="0.38" transform="rotate(45 16 16)"/>
  <!-- diagonal ray NE-SW -->
  <rect x="15" y="2" width="2" height="25" rx="1" fill="#0F4C81" opacity="0.38" transform="rotate(-45 16 16)"/>
  <!-- center dot -->
  <circle cx="16" cy="16" r="3" fill="#0F4C81"/>
</svg>
